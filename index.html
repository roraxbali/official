<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER ANONYMOUS by RORAXBRINGAZ</title>
  <style>
    :root {
      /* ═══ TEMA DISAMAKAN DENGAN DASHBOARD ═══ */
      --bg:      #04070d;
      --bg2:     #0a101c;
      --bg3:     #0e1626;
      --gold:    #00e58a;
      --gold2:   #66ffc2;
      --gold-d:  #0d3f2e;
      --cyan:    #38bdf8;
      --cyan-d:  #0c2f45;
      --green:   #00e58a;
      --green-d: #0a2e21;
      --red:     #ff3355;
      --text:    #cfd9e6;
      --text-d:  #5d7186;
      --border:  #152030;
      --border2: #1d2a3c;
      --radius:  4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      /* ═══ BACKGROUND SAMA DENGAN DASHBOARD ═══ */
      background:
        radial-gradient(1100px 520px at 85% -12%, rgba(56,189,248,.10), transparent 60%),
        radial-gradient(900px 480px at -10% 108%, rgba(0,229,138,.06), transparent 60%),
        linear-gradient(180deg, #071021 0%, #04070d 45%, #02050a 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* scanline overlay — sama dengan dashboard */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,229,138,.012) 0px,
        rgba(0,229,138,.012) 1px,
        transparent 1px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* corner accent — sama dengan dashboard */
    body::after {
      content: '';
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(0,229,138,.08);
      border-radius: 4px;
      pointer-events: none;
    }

    .box {
      background: var(--bg2);
      background-image: linear-gradient(180deg, rgba(56,189,248,.06), rgba(56,189,248,0) 42%);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 40px 30px 32px;
      width: 100%;
      max-width: 360px;
      position: relative;
      z-index: 2;
      /* glow sama dengan dashboard */
      box-shadow:
        inset 0 1px 0 rgba(148,205,255,.08),
        inset 0 0 46px rgba(56,189,248,.035),
        0 10px 26px rgba(0,0,0,.45);
    }

    /* top label strip */
    .box-label {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      padding: 0 12px;
      color: var(--gold);
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(0,229,138,.5), 0 0 26px rgba(0,229,138,.22);
    }

    /* corner L-brackets */
    .box::before, .box::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      pointer-events: none;
    }
    .box::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--gold);
      border-left: 2px solid var(--gold);
      border-radius: 4px 0 0 0;
    }
    .box::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--gold);
      border-right: 2px solid var(--gold);
      border-radius: 0 0 4px 0;
    }

    h2 {
      text-align: center;
      color: var(--gold);
      letter-spacing: 6px;
      margin-bottom: 4px;
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,229,138,.5), 0 0 26px rgba(0,229,138,.22);
      animation: goldpulse 3s ease-in-out infinite;
    }
    @keyframes goldpulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .8; }
    }

    .subtitle {
      text-align: center;
      font-size: 9px;
      color: var(--text-d);
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 9px;
      color: var(--text-d);
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      margin-bottom: 16px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--cyan);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      outline: none;
      transition: border-color .2s;
      /* glow cyan sama dengan dashboard */
      text-shadow: 0 0 9px rgba(56,189,248,.45);
      box-shadow: inset 0 0 14px rgba(56,189,248,.06);
    }
    input::placeholder { color: var(--text-d); }
    input:focus { border-color: var(--gold-d); }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: var(--gold);
      background-image: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,0) 55%);
      border: none;
      color: #000;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: var(--radius);
      text-transform: uppercase;
      transition: opacity .15s;
      /* glow hijau sama dengan tombol dashboard */
      box-shadow: 0 0 16px rgba(0,229,138,.30), inset 0 1px 0 rgba(255,255,255,.35);
    }
    button:hover  { opacity: .88; }
    button:active { opacity: .72; transform: scale(.99); }

    #err {
      text-align: center;
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 2px;
      min-height: 16px;
      color: var(--red);
    }

    .footer {
      text-align: center;
      font-size: 9px;
      color: var(--text-d);
      margin-top: 22px;
      letter-spacing: 2px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      line-height: 1.8;
    }

    /* status dot — warna hijau sama dengan dashboard */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 24px;
      font-size: 9px;
      color: var(--text-d);
      letter-spacing: 2px;
    }
    .sdot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
      animation: spulse 2s ease-in-out infinite;
    }
    @keyframes spulse {
      0%,100%{ opacity:1; box-shadow:0 0 5px var(--green) }
      50%    { opacity:.5; box-shadow:0 0 2px var(--green) }
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="box-label">◈ Cyber Terminal ◈</span>

    <h2>CYBER ANONYMOUS</h2>
    <div class="subtitle">by RORAXBRINGAZ</div>

    <div class="status-row">
      <span class="sdot"></span>
      <span>SYSTEM ONLINE</span>
    </div>

    <label>Username</label>
    <input id="user" placeholder="masukkan username" autocomplete="off">

    <label>Password</label>
    <input id="pass" type="password" placeholder="masukkan password">

    <button onclick="doLogin()">» ACCESS «</button>
    <p id="err"></p>

    <div class="footer">
      [ AUTHORIZED ACCESS ONLY ]<br>
      by RORAXBRINGAZ
    </div>
  </div>

<script type="module">
import { login } from './login.js';

window.doLogin = () => {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');

  err.innerText = '';

  if (!u || !p) {
    err.innerText = '[!] ISI USERNAME & PASSWORD';
    return;
  }

  const result = login(u, p);

  if (result.success) {
    err.style.color = '#00e58a';
    err.innerText = result.message;
    localStorage.setItem('username', u);

    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 500);
  } else {
    err.style.color = '#ff3355';
    err.innerText = result.message;
  }
};

document.getElementById('pass').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('user').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});
</script>
</body>
</html>
