<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Tracker - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #6a8caf 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      overflow: hidden;
      position: relative;
    }
    /* Awan dekoratif */
    body::before, body::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
    }
    body::before {
      width: 300px; height: 300px;
      top: -80px; left: -80px;
      animation: float 8s ease-in-out infinite;
    }
    body::after {
      width: 250px; height: 250px;
      bottom: -60px; right: -60px;
      animation: float 10s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .box {
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }
    .logo {
      text-align: center;
      font-size: 55px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
    }
    h2 {
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }
    label {
      display: block;
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      font-family: inherit;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    input:focus {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.6);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: white;
      color: #1e3c72;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    button:active { transform: translateY(0); }
    #err {
      color: #ffb3b3;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      min-height: 16px;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      opacity: 0.5;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">⛅</div>
    <h2>Weather Tracker</h2>
    <div class="subtitle">Masuk untuk melanjutkan</div>

    <label>Username</label>
    <input id="user" placeholder="Masukkan username" autocomplete="off">

    <label>Password</label>
    <input id="pass" type="password" placeholder="Masukkan password">

    <button onclick="login()">Masuk</button>
    <p id="err"></p>

    <div class="footer">Powered by Open-Meteo API</div>
  </div>

<script>
function login() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  if (!u || !p) {
    document.getElementById('err').innerText = 'Isi username & password';
    return;
  }
  localStorage.setItem('username', u);
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
