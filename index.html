<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER ANONYMOUS by RORAXBRINGAZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e14;
      color: #00ff9d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,255,157,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,157,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,157,0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }
    .box {
      background: rgba(10, 20, 30, 0.9);
      border: 2px solid #00ff9d;
      border-radius: 8px;
      padding: 45px 30px 35px;
      width: 100%;
      max-width: 360px;
      box-shadow: 
        0 0 20px rgba(0,255,157,0.5),
        0 0 40px rgba(0,255,157,0.2),
        inset 0 0 20px rgba(0,255,157,0.05);
      position: relative;
      z-index: 2;
    }
    .box::before {
      content: '◢ CYBER ANONYMOUS ◣';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a0e14;
      padding: 0 10px;
      color: #00ff9d;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #00ff9d;
      white-space: nowrap;
    }
    h2 {
      text-align: center;
      color: #00ff9d;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-shadow: 
        0 0 10px #00ff9d, 
        0 0 20px #00ff9d, 
        0 0 30px #00ff9d;
      font-size: 22px;
      font-weight: bold;
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px #00ff9d, 0 0 20px #00ff9d; }
      50% { text-shadow: 0 0 15px #00ff9d, 0 0 30px #00ff9d, 0 0 45px #00ff9d; }
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #7dfcce;
      letter-spacing: 3px;
      margin-bottom: 30px;
      opacity: 0.85;
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 10px;
      color: #7dfcce;
      letter-spacing: 2px;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      background: rgba(0,255,157,0.05);
      border: 1px solid #00ff9d;
      border-radius: 3px;
      color: #00ff9d;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s;
    }
    input::placeholder { color: rgba(0,255,157,0.35); }
    input:focus {
      box-shadow: 0 0 15px #00ff9d;
      background: rgba(0,255,157,0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background: transparent;
      border: 2px solid #00ff9d;
      color: #00ff9d;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 0 0 5px #00ff9d;
      font-weight: bold;
      border-radius: 3px;
    }
    button:hover {
      background: #00ff9d;
      color: #0a0e14;
      box-shadow: 0 0 20px #00ff9d, 0 0 40px #00ff9d;
      text-shadow: none;
    }
    button:active { transform: scale(0.98); }
    #err {
      color: #ff3366;
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #ff3366;
      min-height: 16px;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #7dfcce;
      opacity: 0.55;
      margin-top: 22px;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="box">
    <h2>CYBER ANONYMOUS</h2>
    <div class="subtitle">by RORAXBRINGAZ</div>

    <label>USERNAME</label>
    <input id="user" placeholder="username" autocomplete="off">

    <label>PASSWORD</label>
    <input id="pass" type="password" placeholder="password">

    <button onclick="login()">» ACCESS «</button>
    <p id="err"></p>

    <div class="footer">» ACCESS GRANTED « by RORAXBRINGAZ</div>
  </div>

<script>
function login() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  if (!u || !p) {
    document.getElementById('err').innerText = '[!] ISI SEMUA FIELD';
    return;
  }
  localStorage.setItem('username', u);
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
